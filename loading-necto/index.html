<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NECTO — Kinetic Brand Loading Screen</title>
    <!-- Tipografía oficial DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-brand: #FF3F1A;
        --color-navy: #190088;
        --color-white: #FFFFFF;
        --color-cream: #EFE6D3;
        --font-dm: "DM Sans", -apple-system, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--color-brand);
        font-family: var(--font-dm);
        color: var(--color-white);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FF3F1A;
      }

      /* Geometría circular de marca de fondo Necto */
      .bg-circle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .circle-1 {
        width: 900px;
        height: 900px;
        top: -300px;
        left: -250px;
        border: 44px solid rgba(255, 255, 255, 0.08);
      }

      .circle-2 {
        width: 760px;
        height: 760px;
        bottom: -280px;
        right: -200px;
        border: 36px solid rgba(255, 255, 255, 0.07);
      }

      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Líneas de conexión cinética de red */
      .connection-line {
        position: absolute;
        stroke: var(--color-navy);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        opacity: 0;
        filter: drop-shadow(0 0 6px rgba(25, 0, 136, 0.4));
      }

      /* Typography subtitle */
      .loading-label {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #FFFFFF;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <!-- Fondos de marca con data-layout-allow-overflow -->
      <div class="bg-circle circle-1" data-layout-allow-overflow></div>
      <div class="bg-circle circle-2" data-layout-allow-overflow></div>

      <!-- Lienzo SVG con líneas de conexión cinéticas entre letras -->
      <svg
        id="network-svg"
        style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"
      >
        <line id="line-n-e" class="connection-line" x1="840" y1="520" x2="910" y2="520" />
        <line id="line-e-c" class="connection-line" x1="910" y1="520" x2="980" y2="520" />
        <line id="line-c-t" class="connection-line" x1="980" y1="520" x2="1050" y2="520" />
        <line id="line-t-o" class="connection-line" x1="1050" y1="520" x2="1120" y2="520" />
      </svg>

      <!-- Escenario central -->
      <div class="stage" style="z-index: 10;">

            <!-- Tagline oficial grow together en dos líneas -->
            <g id="tagline" transform="translate(-52 32)" style="opacity: 0;">
              <path d="M112.395 7.20971L112.989 5.9404C113.609 6.27042 114.229 6.47351 115.03 6.47351C116.192 6.47351 116.76 5.91501 116.76 4.87417V4.59492C116.243 5.17881 115.701 5.5596 114.797 5.5596C113.402 5.5596 112.111 4.54415 112.111 2.79249C112.111 0.990066 113.402 0 114.771 0C115.701 0 116.243 0.380795 116.708 0.888521V0.101545H118.413V4.69647C118.413 5.76269 118.154 6.52428 117.638 7.03201C117.07 7.59051 116.218 7.81898 115.055 7.81898C114.074 7.81898 113.144 7.59051 112.395 7.20971ZM116.734 2.79249C116.734 1.95475 116.088 1.39625 115.262 1.39625C114.436 1.39625 113.79 1.95475 113.79 2.76711C113.79 3.60486 114.41 4.16336 115.262 4.16336C116.114 4.16336 116.734 3.60486 116.734 2.79249Z" fill="#FFFFFF"/>
              <path d="M119.962 0.101544H121.667V1.2947C122.003 0.482339 122.571 -0.0507738 123.578 -1.12853e-06V1.75165H123.475C122.338 1.75165 121.641 2.43708 121.641 3.83333V6.01655H119.936V0.101544H119.962Z" fill="#FFFFFF"/>

              <path d="M131.171 0.101543H132.901L133.857 3.68101L134.993 0.0761566H136.465L137.602 3.7064L138.583 0.101543H140.287L138.402 6.06733H136.853L135.69 2.43708L134.502 6.06733H132.979L131.171 0.101543Z" fill="#FFFFFF"/>

              <path d="M112.654 14.4956V11.7031H111.93V10.2561H112.654V8.73289H114.358V10.2561H115.778V11.7031H114.358V14.2417C114.358 14.6225 114.539 14.8256 114.9 14.8256C115.21 14.8256 115.494 14.7494 115.753 14.6225V15.968C115.391 16.1711 114.978 16.298 114.41 16.298C113.377 16.298 112.654 15.8918 112.654 14.521V14.4956Z" fill="#FFFFFF"/>
              <path d="M116.579 13.2517C116.579 11.5254 117.974 10.1545 119.859 10.1545C121.744 10.1545 123.113 11.5254 123.113 13.2009C123.113 14.9271 121.718 16.298 119.833 16.298C117.948 16.298 116.579 14.9271 116.579 13.2263V13.2517ZM121.409 13.2517C121.409 12.3631 120.763 11.6015 119.833 11.6015C118.903 11.6015 118.284 12.3377 118.284 13.2009C118.284 14.0894 118.929 14.851 119.859 14.851C120.789 14.851 121.409 14.1148 121.409 13.2517Z" fill="#FFFFFF"/>
              <path d="M124.379 17.3642L124.973 16.0949C125.592 16.4249 126.212 16.628 127.013 16.628C128.175 16.628 128.743 16.0695 128.743 15.0287V14.7494C128.227 15.3333 127.684 15.7141 126.78 15.7141C125.386 15.7141 124.094 14.6987 124.094 12.947C124.094 11.17 125.386 10.1545 126.78 10.1545C127.71 10.1545 128.252 10.5353 128.717 11.043V10.2815H130.422V14.851C130.422 15.9172 130.164 16.6788 129.647 17.1865C129.079 17.745 128.227 17.9735 127.064 17.9735C126.083 17.9735 125.179 17.745 124.404 17.3642H124.379ZM128.717 12.947C128.717 12.1093 128.072 11.5508 127.245 11.5508C126.419 11.5508 125.799 12.1093 125.799 12.9216C125.799 13.7594 126.419 14.3179 127.245 14.3179C128.072 14.3179 128.717 13.7594 128.717 12.947Z" fill="#FFFFFF"/>
              <path d="M131.636 13.2517C131.636 11.5508 132.85 10.1545 134.606 10.1545C136.62 10.1545 137.55 11.6777 137.55 13.3786C137.55 13.5055 137.55 13.6578 137.55 13.8102H133.366C133.521 14.5717 134.063 14.9779 134.838 14.9779C135.406 14.9779 135.82 14.8002 136.31 14.3686L137.292 15.2064C136.723 15.8918 135.923 16.3234 134.838 16.3234C133.03 16.3234 131.687 15.0795 131.687 13.2517H131.636ZM135.871 12.7439C135.768 11.9823 135.329 11.4746 134.606 11.4746C133.883 11.4746 133.444 11.9823 133.314 12.7439H135.897H135.871Z" fill="#FFFFFF"/>

          </svg>
        </div>

        <!-- Indicador de carga cinético piramidal -->
        <div id="loader-box" style="margin-top: 50px; display: flex; flex-direction: column; align-items: center; opacity: 0;">
          <!-- Barra de carga con pista blanca y segmento azul marino -->
          <div style="width: 480px; height: 10px; border-radius: 9999px; background: rgba(255, 255, 255, 0.95); overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);">
            <div id="progress-bar" style="width: 0%; height: 100%; border-radius: 9999px; background: #190088;"></div>
          </div>
          <!-- Subtítulo nítido Conectando tu negocio -->
          <p class="loading-label" style="margin-top: 22px;">
            Conectando tu negocio
          </p>
        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════════════
         GSAP TIMELINE: KINETIC TYPOGRAPHY ANIMATION (6.0s)
         ════════════════════════════════════════════════════════════════════════ -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ── SCENE 1 — IGNITION (0.0s – 1.0s) ──────────────────────────────────
      // El acento azul marino de la N inicia la animación con movimiento deliberado
      tl.fromTo(
        "#accent-blue",
        { opacity: 0, scale: 0.2, x: -30, y: -20 },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.8, ease: "power4.out" },
        0.1
      );

      // ── SCENE 2 — DECONSTRUCTION (1.0s – 2.0s) ────────────────────────────
      // Las letras blancas se separan sutilmente en trayectorias suaves
      tl.fromTo("#letter-n", { opacity: 0, x: -28, y: -10 }, { opacity: 1, x: -14, y: -5, duration: 0.7, ease: "power2.out" }, 0.9);
      tl.fromTo("#letter-e", { opacity: 0, x: -15, y: 12 }, { opacity: 1, x: -7, y: 6, duration: 0.7, ease: "power2.out" }, 1.05);
      tl.fromTo("#letter-c", { opacity: 0, y: -14 }, { opacity: 1, y: -6, duration: 0.7, ease: "power2.out" }, 1.15);
      tl.fromTo("#letter-t", { opacity: 0, x: 15, y: 12 }, { opacity: 1, x: 8, y: 5, duration: 0.7, ease: "power2.out" }, 1.25);
      tl.fromTo("#letter-o", { opacity: 0, x: 28, y: -10 }, { opacity: 1, x: 14, y: -4, duration: 0.7, ease: "power2.out" }, 1.35);

      // ── SCENE 3 — CONNECTION SEQUENCE (2.0s – 3.2s) ───────────────────────
      // Líneas de conexión elegantes conectan la red
      tl.to("#line-n-e", { opacity: 0.8, strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 1.9);
      tl.to("#line-e-c", { opacity: 0.8, strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 2.15);
      tl.to("#line-c-t", { opacity: 0.8, strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 2.4);
      tl.to("#line-t-o", { opacity: 0.8, strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 2.65);

      // El acento azul realiza un viaje interactivo de conexión
      tl.to("#accent-blue", { x: 3, y: -2, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.1);

      // ── SCENE 4 — RECONNECTION (3.0s – 3.9s) ──────────────────────────────
      // Atracción magnética: las letras regresan a su alineación perfecta oficial
      tl.to(
        ["#letter-n", "#letter-e", "#letter-c", "#letter-t", "#letter-o"],
        { x: 0, y: 0, duration: 0.7, ease: "power4.out" },
        3.0
      );
      // Retiro instantáneo y elegante de las líneas de conexión
      tl.to(".connection-line", { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.1);

      // ── SCENE 5 — GROW TOGETHER (3.6s – 4.4s) ─────────────────────────────
      // Aparición del claim en 2 líneas bajo el logotipo
      tl.fromTo(
        "#tagline",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        3.6
      );
      // Pulso sutil en el acento azul
      tl.to("#accent-blue", { scale: 1.12, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 3.9);

      // ── SCENE 6 — LOADING STATE (3.8s – 6.0s) ─────────────────────────────
      // Barra de carga y "Conectando tu negocio" con tiempo de lectura óptimo (2.2s)
      tl.to("#loader-box", { opacity: 1, duration: 0.45, ease: "power2.out" }, 3.8);
      tl.to("#progress-bar", { width: "100%", duration: 2.1, ease: "power1.inOut" }, 3.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
